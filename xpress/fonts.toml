# Desktop: the fonts that come with CAD Studio, searched after the installed ones. The scan reads
# the list from its end and keeps the first file found for a name, so they go first in the list.
[[text]]
file = "crates/fonts/src/ttf.rs"
old = """
    dirs
}

/// Every font file under [`system_font_dirs`], by lower-case file stem."""
new = """
    // CAD Studio: the fonts that come with it (CADCRAFT_BUNDLED_FONTS, set by Xpress Survey's desktop
    // app), read after every installed font, so the real Times New Roman wins over its stand-in.
    if let Some(v) = std::env::var_os("CADCRAFT_BUNDLED_FONTS") {
        let mut bundled: Vec<PathBuf> = std::env::split_paths(&v).filter(|p| !p.as_os_str().is_empty()).collect();
        bundled.append(&mut dirs);
        dirs = bundled;
    }
    dirs
}

/// Every font file under [`system_font_dirs`], by lower-case file stem."""
