# Xpress Survey's jobs in CAD Studio. A job's drawing opens in CAD Studio from the job, and its page saves the
# drawing's boundary back to the job (Save to job). Two commands for that page:
#   - SAVEJOB, typed in CAD Studio: asks the page to save to the job (the page shows what changes first);
#   - xpress.state: what the page reads every few seconds: how many SAVEJOBs there have been, and a mark of the
#     active drawing that changes with each edit, undo and redo (for the page's running summary of the changes).
# The page reads them through the web build's window.cadcraft.execute, and on the desktop through the control
# channel (engine.execute), which has no way to tell the page of anything by itself.
#
# Each rule replaces `old` (found exactly once) by `new`, as rename.toml's [[text]] rules do.

[[text]]
file = "crates/engine/src/cmd/file.rs"
old = """
        CommandSpec::new("document.bytes", "Drawing as bytes", run_bytes)"""
new = """
        // CAD Studio: Xpress Survey's jobs (xpress/jobs.toml).
        CommandSpec::new("savejob", "Save to Job", run_savejob)
            .params("{} (asks Xpress Survey's page to save the drawing's boundary to the job it was opened from)")
            .noundo(),
        CommandSpec::new("xpress.state", "Xpress Survey State", run_xpress_state)
            .params("{} → {savejob: SAVEJOBs so far, drawing: a mark of the active drawing that changes with each edit, or null}")
            .enabled(always)
            .noundo(),
        CommandSpec::new("document.bytes", "Drawing as bytes", run_bytes)"""

