new = """
/// CAD Studio: SAVEJOBs so far, for Xpress Survey's page (`xpress.state`).
static SAVEJOB: std::sync::atomic::AtomicU64 = std::sync::atomic::AtomicU64::new(0);

/// CAD Studio: SAVEJOB. The page that opened the drawing from a job sees it in `xpress.state` and shows what
/// would change before it saves.
fn run_savejob(s: &mut Session, _p: &Value) -> Result<Value> {
    s.state()?;
    let n = SAVEJOB.fetch_add(1, std::sync::atomic::Ordering::Relaxed) + 1;
    s.echo("Save to job: Xpress Survey shows what changes before it saves.");
    Ok(json!({ "savejob": n }))
}

/// CAD Studio: what Xpress Survey's page reads every few seconds. The drawing's mark is its id, the drawing itself
/// (a new one with each change: drawings are copied on write) and its undo and redo depths.
fn run_xpress_state(s: &mut Session, _p: &Value) -> Result<Value> {
    let drawing = s
        .state()
        .ok()
        .map(|st| format!("{}:{:x}:{}:{}", st.uid, std::sync::Arc::as_ptr(&st.doc) as usize, st.undo.len(), st.redo.len()));
    Ok(json!({ "savejob": SAVEJOB.load(std::sync::atomic::Ordering::Relaxed), "drawing": drawing }))
}

fn run_bytes(s: &mut Session, p: &Value) -> Result<Value> {"""

