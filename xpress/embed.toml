pub const PREFS_KEY: &str = "cadcraft.prefs";"""
new = """
pub const PREFS_KEY: &str = "cadcraft.prefs";

/// CAD Studio: inside an Xpress Survey job's page (`?embed`, xpress/embed.toml).
static EMBEDDED: std::sync::atomic::AtomicBool = std::sync::atomic::AtomicBool::new(false);

/// CAD Studio: set once as the web build starts, from `?embed`.
pub fn set_embedded(on: bool) {
    EMBEDDED.store(on, std::sync::atomic::Ordering::Relaxed);
}

/// CAD Studio: whether this is inside an Xpress Survey job's page.
pub fn embedded() -> bool {
    EMBEDDED.load(std::sync::atomic::Ordering::Relaxed)
}

/// CAD Studio: what a command typed (or chosen by its shortcut) is inside a job's page. `None`: it runs as anywhere.
/// `Some(true)`: SAVE, which saves to the job (SAVEJOB). `Some(false)`: a command that opens, starts, closes or
/// writes other files, which the job's page does instead.
pub fn embedded_command(id: &str) -> Option<bool> {
    match id {
        "qsave" | "save" => Some(true),
        "saveas" | "ui.saveas" | "saveall" | "new" | "qnew" | "ui.newtemplate" | "open" | "ui.open" | "recover" | "xopen" | "close" | "closeall"
        | "document.switch" | "ui.sample" | "export" | "exportpdf" | "plot" | "publish" | "pdfbook" | "share" | "wblock" | "-wblock" | "quit"
        | "exit" => Some(false),
        _ => None,
    }
}"""

