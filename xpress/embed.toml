new = """
    /// CAD Studio: inside a job's page, a typed SAVE saves to the job and the commands for other files say they are not
    /// here (xpress/embed.toml). True when `name` was one of those.
    fn embedded_typed(&mut self, name: &str) -> bool {
        if !embedded() {
            return false;
        }
        let id = cadcraft_engine::cmd::resolve_alias(name.trim());
        match embedded_command(&id) {
            None => false,
            Some(true) => {
                if let Err(e) = self.session.execute("savejob", &Value::Null) {
                    self.session.echo(e.to_string());
                }
                true
            }
            Some(false) => {
                self.session.echo(format!(
                    "{} is not in the job's drawing: SAVE saves it to the job, and the job's files come from Xpress Survey.",
                    name.trim().to_ascii_uppercase()
                ));
                true
            }
        }
    }

    /// Start a command as if typed (interactive when it has prompts).
    pub fn start(&mut self, name: &str) {
        if self.embedded_typed(name) {
            return;
        }
        if menus::run_ui_command(self, name, &Value::Null).is_some() {"""

