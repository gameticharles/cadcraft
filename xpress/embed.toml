# CAD Studio inside an Xpress Survey job's page (the Layers tab), asked for by `?embed` in the web build's URL. The
# job's drawing is the job's: the page opens it, saves it to the job and gives the job's files, so CAD Studio here has
# no menu bar, Tool Bar, file tabs or Start page, and the commands that would open, start, close or write other
# files are not typed here:
#   - SAVE, QSAVE (Ctrl+S) run SAVEJOB (jobs.toml): the page saves the drawing to the job;
#   - NEW, OPEN, CLOSE, SAVEAS, EXPORT, PLOT, PUBLISH, WBLOCK and the like say they are not in the job's drawing.
# The page itself still runs any command through window.cadcraft.execute (CadApp::run), which this does not touch.
# Nothing here is saved: the panel layout chosen in the job's page is not kept, so CAD Studio on its own page opens
# as the user left it there (menus and Tool Bar are never saved by the web build).
#
# The entities query also gives each entity's xdata, so the page can tell the job's points and lines (XPRESS ids)
# from what was drawn by hand.
#
# Each rule replaces `old` (found exactly once) by `new`, as rename.toml's [[text]] rules do.

